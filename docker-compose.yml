services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:?POSTGRES_USER is required; set POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD, MINIO_ROOT_USER, and MINIO_ROOT_PASSWORD in .env}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required; set POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD, MINIO_ROOT_USER, and MINIO_ROOT_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required; set POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD, MINIO_ROOT_USER, and MINIO_ROOT_PASSWORD in .env}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required; set POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD, MINIO_ROOT_USER, and MINIO_ROOT_PASSWORD in .env}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required; set POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD, MINIO_ROOT_USER, and MINIO_ROOT_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - nexus_network

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required; set POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD, MINIO_ROOT_USER, and MINIO_ROOT_PASSWORD in .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required; set POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD, MINIO_ROOT_USER, and MINIO_ROOT_PASSWORD in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required; set POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD, MINIO_ROOT_USER, and MINIO_ROOT_PASSWORD in .env}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - nexus_postgres_data:/var/lib/postgresql/data
    networks:
      - nexus_network

  redis:
    image: redis:alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexus_network

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required; set POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD, MINIO_ROOT_USER, and MINIO_ROOT_PASSWORD in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required; set POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD, MINIO_ROOT_USER, and MINIO_ROOT_PASSWORD in .env}
    healthcheck:
      test:
        - CMD-SHELL
        - mc ready local
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - nexus_minio_data:/data
    networks:
      - nexus_network

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - $$s=@fsockopen('127.0.0.1',8080); exit($$s?0:1);
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - nexus_network

networks:
  nexus_network:
    name: nexus_network
    driver: bridge

volumes:
  nexus_postgres_data:
    name: nexus_postgres_data
  nexus_minio_data:
    name: nexus_minio_data
